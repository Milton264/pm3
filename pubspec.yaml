name: musa
description: Tu estilo, tu armario, infinitas posibilidades.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  image_picker: ^1.2.1
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/images/
  fonts:
    - family: Editorial
      fonts:
        - asset: assets/fonts/Editorial.ttf
    - family: Atelier
      fonts:
        - asset: assets/fonts/Atelier.ttf
        - asset: assets/fonts/Atelier-Bold.ttf
          weight: 700
